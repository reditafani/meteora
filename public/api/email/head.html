<!DOCTYPE html>
<html lang="{{lang}}" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{subject}}</title>
<!--[if mso]>
<noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
<style>table,td,div,p,a,span{font-family:Arial,Helvetica,sans-serif!important}.em-serif{font-family:Georgia,'Times New Roman',serif!important}</style>
<![endif]-->
<style>
  /* Shared <head> of the meteoraevents.com emails (filled by public/api/emails.php).
     Light theme inline in each template; dark theme for the clients that support
     it (Apple Mail, iOS Mail, Outlook.com, Outlook app); Gmail applies its own
     inversion, so every colour is picked to survive it. */
  :root { color-scheme: light dark; supported-color-schemes: light dark; }
  body { margin: 0 !important; padding: 0 !important; width: 100% !important; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse; }
  img { border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; display: block; }
  a { text-decoration: none; }
  a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; font: inherit !important; }
  u + #body a { color: inherit; text-decoration: none; font: inherit; }
  #MessageViewBody a { color: inherit; text-decoration: none; font: inherit; }

  @media (max-width: 620px) {
    .em-shell { width: 100% !important; }
    .em-pad { padding-left: 24px !important; padding-right: 24px !important; }
    .em-hero-pad { padding: 40px 24px 32px !important; }
    .em-headline { font-size: 32px !important; line-height: 38px !important; }
    .em-summary-pad { padding: 18px 18px 6px !important; }
    .em-label { width: 92px !important; }
    .em-num { width: 52px !important; font-size: 26px !important; }
  }

  @media (prefers-color-scheme: dark) {
    .em-body, .em-page { background-color: #12100e !important; }
    .em-bg { background-color: #1c1815 !important; }
    .em-box { background-color: #26201b !important; }
    .em-foot { background-color: #171411 !important; }
    .em-text { color: #f1e9de !important; }
    .em-muted { color: #a59b90 !important; }
    .em-soft { color: #8c8278 !important; }
    .em-gold { color: #cdb07a !important; }
    .em-num-off { color: #4b433b !important; }
    .em-line { border-color: #3a322b !important; }
    .em-rule { background-color: #8a7350 !important; }
    .em-link { color: #cdb07a !important; border-color: #8a7350 !important; }
  }
  /* Outlook.com / Outlook apps in dark mode */
  [data-ogsc] .em-text { color: #f1e9de !important; }
  [data-ogsc] .em-muted { color: #a59b90 !important; }
  [data-ogsc] .em-soft { color: #8c8278 !important; }
  [data-ogsc] .em-gold, [data-ogsc] .em-link { color: #cdb07a !important; }
  [data-ogsc] .em-num-off { color: #4b433b !important; }
  [data-ogsb] .em-body, [data-ogsb] .em-page { background-color: #12100e !important; }
  [data-ogsb] .em-bg { background-color: #1c1815 !important; }
  [data-ogsb] .em-box { background-color: #26201b !important; }
  [data-ogsb] .em-foot { background-color: #171411 !important; }
</style>
</head>
